<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>鹿児島城 2D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a1a;overflow:hidden;font-family:sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:8px;left:8px;color:#eee;font-size:13px;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:6px;pointer-events:none;line-height:1.5;z-index:10}
#joy{position:fixed;bottom:24px;left:24px;width:120px;height:120px;border-radius:60px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);touch-action:none;z-index:10}
#joy .knob{position:absolute;width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.5);left:36px;top:36px;pointer-events:none}
#enter{position:fixed;bottom:24px;right:24px;padding:14px 22px;background:rgba(255,204,0,.9);color:#3a2e00;font-size:18px;font-weight:bold;border:none;border-radius:10px;z-index:11;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">読み込み中…</div>
<div id="joy"><div class="knob"></div></div>
<button id="enter">入る</button>
<script>
const GRID = 26;
const BG_SRC = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAjwAAAI8CAIAAAB6bebNAAANrklEQVR4nO3XMYieh33H8UflcM0tlqE2EhLCxRjcA+GLkD0YYWQIIt6MIUsXIwiBLJpNhxACoVqyeAmkAaGhiwulm42WimCCiQ5xQXCYuq5FULCxTeMsh5IO7eBAU7IU/i8871d8Pvv9+N9z771fnhMf3H5nAYCCv1j7AAD4/xItADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyNhZ+4BHx83759c+AXhkvfnMvbVP2AretADIEC0AMkQLgAzRAiBDtADIEC0AMkQLgAzRAiBDtADIEC0AMkQLgAzRAiBDtADIEC0AMkQLgAzRAiBDtADIEC0AMkQLgAzRAiBDtADI2Fn7AP7X+eN31z6BjXnw/j8PF85eemMjl7AN7u2+tvYJjwhvWgBkiBYAGaIFQIZoAZAhWgBkiBYAGaIFQIZoAZAhWgBkiBYAGaIFQIZoAZAhWgBkiBYAGaIFQIZoAZAhWgBkiBYAGaIFQIZoAZAhWgBk7Kx9AJt0Ye/s2ifwRxf2rq19Ahtz9+jB2ifwR960AMgQLQAyRAuADNECIEO0AMgQLQAyRAuADNECIEO0AMgQLQAyRAuADNECIEO0AMgQLQAyRAuADNECIEO0AMgQLQAyRAuADNECIEO0AMjYmU8cHR4MF5556uFw4f1bd4cLG/DqP6x9wVaYfx729i9u5JJ1eQ5fmz+Hf/uP/xwuvP7GleHCo2H3vevDheNvvbWRSya8aQGQIVoAZIgWABmiBUCGaAGQIVoAZIgWABmiBUCGaAGQIVoAZIgWABmiBUCGaAGQIVoAZIgWABmiBUCGaAGQIVoAZIgWABmiBUCGaAGQceKD2+8MJ44ODzZySt2dk1eHC+eP3x0uPP6Hz4YLwJ97+Nip4cK93deGCy9+dWO4sA329i8OF7xpAZAhWgBkiBYAGaIFQIZoAZAhWgBkiBYAGaIFQIZoAZAhWgBkiBYAGaIFQIZoAZAhWgBkiBYAGaIFQIZoAZAhWgBkiBYAGaIFQIZoAZCxs/YBy7Isd756Zbhw+pPrw4XXTx8PF+6cvDpcmNvbv7j2CcvR4cFwYRt+iznP4WuPxnO4e/Rg7ROWv3zqueHCx7dubuSSiflf05sWABmiBUCGaAGQIVoAZIgWABmiBUCGaAGQIVoAZIgWABmiBUCGaAGQIVoAZIgWABmiBUCGaAGQIVoAZIgWABmiBUCGaAGQIVoAZIgWABk7ax+wLMvy5uXj6cTla8OB8QXLcn8+wbIsy7N/8/Jw4cc/+sFw4e9++PfDhb39V4cLR4f/OlzgUfLsmSemC1en35PbwJsWABmiBUCGaAGQIVoAZIgWABmiBUCGaAGQIVoAZIgWABmiBUCGaAGQIVoAZIgWABmiBUCGaAGQIVoAZIgWABmiBUCGaAGQIVoAZIgWAB BcmH8/zJ/D7nvTb5iDU98cLuztXxwuzP+75+a/hTctADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJ21j5gWZbl9CfXhwtXrl7byCXr2j1zae0Tlk//+q3hwtnl58OFe799frhwYTkeLrz/0enhwosnPxounH/yw+HCspwbL6xvG57D+6f/drjw+H9/PlzYfW/+PTn9794G3rQAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyBAtADJEC4AM0QIgQ7QAyNhZ+4DNuHl7d7jw7eduja94fPjzd3/16+HChRfODRcuPffpcOH3XwwHNmD+eXjz8vFw4ehwOLA88VdPDBfmz+H8kx8OF6b/FZv4VN+68fb4iqmz33h5uPCTx384XDh94/pw4crVa8OFOW9aAGSIFgAZogVAhmgBkCFaAGSIFgAZogVAhmgBkCFaAGSIFgAZogVAhmgBkCFaAGSIFgAZogVAhmgBkCFaAGSIFgAZogVAhmgBkCFaAGSc+OD2O8OJo8ODjZwCwKNtb//icMGbFgAZogVAhmgBkCFaAGSIFgAZogVAhmgBkCFaAGSIFgAZogVAhmgBkCFaAGSIFgAZogVAhmgBkCFaAGSIFgAZogVAhmgBkCFaAGSIFgAZ/wP25To/VfLStAAAAABJRU5ErkJggg==";
const BLOCKS = [[13, 6], [3, 8], [4, 8], [18, 8], [23, 8], [3, 10], [4, 10], [22, 10], [23, 10], [24, 10], [10, 11], [11, 11], [12, 11], [13, 11], [3, 12], [10, 12], [12, 12], [13, 12], [24, 12], [10, 13], [3, 14], [4, 14], [10, 14], [24, 14], [10, 15], [2, 16], [4, 16], [13, 16], [22, 16], [23, 16], [22, 18], [24, 18], [2, 19], [2, 20], [13, 20], [22, 20], [24, 20], [3, 22], [8, 22], [10, 22], [12, 22], [20, 22], [23, 22], [24, 22], [2, 23], [14, 23], [18, 23], [20, 23], [22, 23], [2, 24], [6, 24], [8, 24], [14, 24], [16, 24], [19, 24], [20, 24], [23, 24]];      // 通れないマス [x,y,...]
const ENTERABLE = [{"x": 2, "y": 8, "type": "民家"}, {"x": 2, "y": 10, "type": "武家屋敷"}, {"x": 2, "y": 12, "type": "武家屋敷"}, {"x": 2, "y": 14, "type": "民家"}, {"x": 12, "y": 14, "type": "御殿"}, {"x": 2, "y": 15, "type": "武家屋敷"}, {"x": 3, "y": 16, "type": "武家屋敷"}, {"x": 2, "y": 18, "type": "武家屋敷"}, {"x": 3, "y": 18, "type": "武家屋敷"}, {"x": 4, "y": 18, "type": "民家"}, {"x": 8, "y": 18, "type": "御殿"}, {"x": 23, "y": 18, "type": "武家屋敷"}, {"x": 3, "y": 20, "type": "民家"}, {"x": 2, "y": 22, "type": "武家屋敷"}, {"x": 6, "y": 22, "type": "民家"}, {"x": 14, "y": 22, "type": "武家屋敷"}, {"x": 18, "y": 22, "type": "武家屋敷"}, {"x": 8, "y": 23, "type": "武家屋敷"}, {"x": 10, "y": 23, "type": "武家屋敷"}, {"x": 12, "y": 23, "type": "武家屋敷"}, {"x": 3, "y": 24, "type": "武家屋敷"}, {"x": 4, "y": 24, "type": "民家"}, {"x": 10, "y": 24, "type": "武家屋敷"}, {"x": 11, "y": 24, "type": "武家屋敷"}, {"x": 15, "y": 24, "type": "武家屋敷"}, {"x": 22, "y": 24, "type": "武家屋敷"}]; // 進入可能な建物 [{x,y,type},...]

let px = 13, py = 21, dir = 'down';
let keys = {};
let inside = null;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const bg = new Image();
const enterBtn = document.getElementById('enter');
bg.onload = () => {
  document.getElementById('hud').innerHTML = '鹿児島城 2D<br>矢印/WASD移動、Eキーで建物に入る';
  requestAnimationFrame(loop);
};
bg.src = BG_SRC;

const blockSet = new Set(BLOCKS.map(b => b[1]*GRID + b[0]));
const enterMap = {};
for(const b of ENTERABLE){ enterMap[b.y*GRID + b.x] = b; }

function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
window.addEventListener('resize', resize);
resize();

window.addEventListener('keydown', e => { keys[e.key.toLowerCase()]=true;
  if(e.key.startsWith('Arrow')) e.preventDefault();
  if(e.key==='e' || e.key==='E'){ enterBtn.click(); }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()]=false; });

const joy = document.getElementById('joy');
const knob = joy.querySelector('.knob');
let joyActive=false, joyDX=0, joyDY=0;
joy.addEventListener('touchstart', e=>{e.preventDefault();joyActive=true;});
joy.addEventListener('touchmove', e=>{
  e.preventDefault();
  const r=joy.getBoundingClientRect();
  let dx=e.touches[0].clientX-(r.left+r.width/2), dy=e.touches[0].clientY-(r.top+r.height/2);
  const m=Math.hypot(dx,dy), max=36;
  if(m>max){dx=dx/m*max;dy=dy/m*max;}
  knob.style.left=(36+dx)+'px'; knob.style.top=(36+dy)+'px';
  joyDX=dx/max; joyDY=dy/max;
});
joy.addEventListener('touchend', e=>{joyActive=false;joyDX=0;joyDY=0;knob.style.left='36px';knob.style.top='36px';});

function blocked(x, y){
  const ix=Math.round(x), iy=Math.round(y);
  if(ix<0||ix>=GRID||iy<0||iy>=GRID) return true;
  return blockSet.has(iy*GRID+ix);
}
function nearEnterable(){
  const ix=Math.round(px), iy=Math.round(py);
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    const k=(iy+dy)*GRID+(ix+dx);
    if(enterMap[k]) return enterMap[k];
  }
  return null;
}
enterBtn.addEventListener('click', ()=>{
  if(inside){ inside=null; } else {
    const b=nearEnterable(); if(b){ inside={b}; px=b.x; py=b.y; }
  }
});

function draw(){
  if(inside){
    ctx.fillStyle='#2a2a2a'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#c8b98a'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='#7a5f3c'; ctx.lineWidth=3;
    const cols=3,rows=2,cw=canvas.width/cols,ch=canvas.height/rows;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      ctx.strokeRect(c*cw,r*ch,cw,ch);
      ctx.fillStyle='#7a5f3c'; ctx.font='18px sans-serif';
      ctx.fillText((c===0?'入口':'部屋')+(r*cols+c),c*cw+12,r*ch+28);
    }
    ctx.fillStyle='#fff'; ctx.font='18px sans-serif';
    ctx.fillText('【'+(inside.b.type)+'】内部',16,30);
    const spx=canvas.width/2,spy=canvas.height/2;
    ctx.fillStyle='#ffcc00'; ctx.beginPath(); ctx.arc(spx,spy,10,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#7a5a00'; ctx.lineWidth=2.5; ctx.stroke();
    enterBtn.style.display='block'; enterBtn.textContent='出る';
  } else {
    ctx.fillStyle='#2a2a2a'; ctx.fillRect(0,0,canvas.width,canvas.height);
    const scale=Math.min(canvas.width/(GRID*22), canvas.height/(GRID*22));
    const ox=(canvas.width-GRID*22*scale)/2, oy=(canvas.height-GRID*22*scale)/2;
    ctx.drawImage(bg, ox, oy, GRID*22*scale, GRID*22*scale);
    const spx=ox+px*22*scale, spy=oy+py*22*scale;
    ctx.fillStyle='#ffcc00'; ctx.beginPath(); ctx.arc(spx,spy,Math.max(7,22*scale*0.45),0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#7a5a00'; ctx.lineWidth=2.5; ctx.stroke();
    const nb=nearEnterable();
    enterBtn.style.display=nb?'block':'none'; enterBtn.textContent='入る';
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  let mx=0,my=0;
  if(keys['arrowleft']||keys['a'])mx-=1;
  if(keys['arrowright']||keys['d'])mx+=1;
  if(keys['arrowup']||keys['w'])my-=1;
  if(keys['arrowdown']||keys['s'])my+=1;
  if(joyActive){mx+=joyDX;my+=joyDY;}
  if(mx||my){
    const m=Math.hypot(mx,my); mx/=m; my/=m;
    const speed=6; const nx=px+mx*speed*dt, ny=py+my*speed*dt;
    if(!inside){
      if(!blocked(nx,py))px=nx;
      if(!blocked(px,ny))py=ny;
    }
    if(Math.abs(mx)>Math.abs(my))dir=mx>0?'right':'left'; else dir=my>0?'down':'up';
  }
  draw(); requestAnimationFrame(loop);
}
</script>
</body>
</html>
