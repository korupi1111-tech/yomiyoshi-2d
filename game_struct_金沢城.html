<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>金沢城 2D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a1a;overflow:hidden;font-family:sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:8px;left:8px;color:#eee;font-size:13px;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:6px;pointer-events:none;line-height:1.5;z-index:10}
#joy{position:fixed;bottom:24px;left:24px;width:120px;height:120px;border-radius:60px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);touch-action:none;z-index:10}
#joy .knob{position:absolute;width:48px;height:48px;border-radius:24px;background:rgba(255,255,255,.5);left:36px;top:36px;pointer-events:none}
#enter{position:fixed;bottom:24px;right:24px;padding:14px 22px;background:rgba(255,204,0,.9);color:#3a2e00;font-size:18px;font-weight:bold;border:none;border-radius:10px;z-index:11;display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">読み込み中…</div>
<div id="joy"><div class="knob"></div></div>
<button id="enter">入る</button>
<script>
const GRID = 24;
const BG_SRC = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAhAAAAIQCAIAAABfYsDeAAALl0lEQVR4nO3XQYjmdR3H8V/1sMSebFHZwyRmJrQQrLIqLIsoyKJIsQhevCQhQlLmMZRMFqxDCBXiQcP25KWQpYhkL0Usgu6wDghzEOuwDhgiohAhBtFhgrr1ht8D/6fh9brPhy//nZ03v898+NHfBgD8L59d+gAA/j8IBgCJYACQCAYAiWAAkAgGAIlgAJAIBgCJYACQCAYAiWAAkAgGAIlgAJAIBgCJYACQCAYAiWAAkAgGAIlgAJAIBgCJYACQCAYAiWAAkAgGAIlgAJAIBgCJYACQCAYAiWAAkAgGAIlgAJAIBgCJYACQCAYAiWAAkAgGAIlgAJAIBgCJYACQCAYAiWAAkAgGAIlgAJAIBgCJYACQCAYAiWAAkAgGAIlgAJAIBgCJYACQCAYAiWAAkAgGAIlgAJAIBgCJYACQCAYAiWAAkAgGAIlgAJAIBgCJYACQCAYAiWAAkAgGAIlgAJAIBgCJYACQCAYAiWAAkAgGAIlgAJAIBgCJYACQCAYAiWAAkAgGAIlgAJAIBgCJYACQCAYAiWAAkAgGAIlgAJAIBgCJYACQrJY+YFM8ef7dpU8ADqxnznxx6RPWwAsDgEQwAEgEA4BEMABIBAOARDAASAQDgEQwAEgEA4BEMABIBAOARDAASAQDgEQwAEgEA4BEMABIBAOARDAASAQDgEQwAEgEA4BktfQBB8fX/v77pU9gbfYuvjK5sHXq/rVcwiZ46/C9S5+wEbwwAEgEA4BEMABIBAOARDAASAQDgEQwAEgEA4BEMABIBAOARDAASAQDgEQwAEgEA4BEMABIBAOARDAASAQDgEQwAEgEA4BEMABIVksfwH/ccmxr6RP4t1uOPbb0CazN5d29pU84ILwwAEgEA4BEMABIBAOARDAASAQDgEQwAEgEA4BEMABIBAOARDAASAQDgEQwAEgEA4BEMABIBAOARDAASAQDgEQwAEgEA4BEMABIVksfABxk51+5MLlw5v7Ta7mEeV4YACSCAUAiGAAkggFAIhgAJIIBQCIYACSCAUAiGAAkggFAIhgAJIIBQCIYACSCAUAiGAAkggFAIhgAJIIBQCIYACSCAUAiGAAkq/mJ8+fOTi6ceeipyYXnvnfP5MK468XZBcYYY+zubE8uHDt+Yi2XLMt32HfTDUeWPmEjzP+dvPTRHZMLzzx+5+SCFwYAiWAAkAgGAIlgAJAIBgCJYACQCAYAiWAAkAgGAIlgAJAIBgCJYACQCAYAiWAAkAgGAIlgAJAIBgCJYACQCAYAiWAAkAgGAMlq6QPGGOP8ubOTC1s3n5xceG/y59dhd2d76RM2gu+wz3fYt4bvcOjoOg5Z2K1X/Wl6487Jn/fCACARDAASwQAgEQwAEsEAIBEMABLBACARDAASwQAgEQwAEsEAIBEMABLBACARDAASwQAgEQwAEsEAIBEMABLBACARDAASwQAgWS19wBhjXProjqVPGOOqpQ8Y49jxE0ufsAZf/urJyYVnn3l6cuGJsz+eXJj363M/mVw4GL8Puzvbkwvz3+Hy7t7kwiY489BTS5/ghQFAIxgAJIIBQCIYACSCAUAiGAAkggFAIhgAJIIBQCIYACSCAUAiGAAkggFAIhgAJIIBQCIYACSCAUAiGAAkggFAIhgAJIIBQLJa+oAxxnjgKxcmF47f96PJhSfPvzu5wL5nn3l6cuHM/afXcQiwZl4YACSCAUAiGAAkggFAIhgAJIIBQCIYACSCAUAiGAAkggFAIhgAJIIBQCIYACSCAUAiGAAkggFAIhgAJIIBQCIYACSCAUAiGAAkq6UPGGOMixcuTy/cM3vEXS/OLrAxdnf+sPQJsGYvXXxkcuFbp16YXPDCACARDAASwQAgEQwAEsEAIBEMABLBACARDAASwQAgEQwAEsEAIBEMABLBAC QDgEQwAEgEA4BEMABIBAOARDAASAQDgEQwAEgEA4DkX7AfARCVhu7FAAAAAElFTkSuQmCC";
const BLOCKS = [[12, 5], [17, 7], [3, 8], [9, 10], [10, 10], [11, 10], [12, 10], [9, 11], [11, 11], [12, 11], [2, 12], [3, 12], [9, 12], [9, 13], [2, 14], [9, 14], [12, 15], [2, 16], [22, 16], [2, 18], [12, 19], [22, 20], [4, 22], [14, 22], [16, 22], [20, 22], [16, 23]];      // 通れないマス [x,y,...]
const ENTERABLE = [{"x": 22, "y": 8, "type": "武家屋敷"}, {"x": 2, "y": 10, "type": "武家屋敷"}, {"x": 3, "y": 10, "type": "武家屋敷"}, {"x": 2, "y": 11, "type": "民家"}, {"x": 11, "y": 13, "type": "御殿"}, {"x": 3, "y": 14, "type": "民家"}, {"x": 22, "y": 14, "type": "民家"}, {"x": 2, "y": 15, "type": "武家屋敷"}, {"x": 22, "y": 15, "type": "寺社"}, {"x": 3, "y": 16, "type": "寺社"}, {"x": 7, "y": 17, "type": "御殿"}, {"x": 22, "y": 18, "type": "寺社"}, {"x": 22, "y": 19, "type": "寺社"}, {"x": 2, "y": 20, "type": "商家"}, {"x": 2, "y": 22, "type": "商家"}, {"x": 3, "y": 22, "type": "寺社"}, {"x": 11, "y": 22, "type": "寺社"}, {"x": 15, "y": 22, "type": "寺社"}, {"x": 19, "y": 22, "type": "寺社"}, {"x": 22, "y": 22, "type": "民家"}, {"x": 8, "y": 23, "type": "民家"}, {"x": 10, "y": 23, "type": "武家屋敷"}, {"x": 14, "y": 23, "type": "寺社"}, {"x": 18, "y": 23, "type": "武家屋敷"}, {"x": 20, "y": 23, "type": "寺社"}, {"x": 22, "y": 23, "type": "寺社"}]; // 進入可能な建物 [{x,y,type},...]

let px = 12, py = 20, dir = 'down';
let keys = {};
let inside = null;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const bg = new Image();
const enterBtn = document.getElementById('enter');
bg.onload = () => {
  document.getElementById('hud').innerHTML = '金沢城 2D<br>矢印/WASD移動、Eキーで建物に入る';
  requestAnimationFrame(loop);
};
bg.src = BG_SRC;

const blockSet = new Set(BLOCKS.map(b => b[1]*GRID + b[0]));
const enterMap = {};
for(const b of ENTERABLE){ enterMap[b.y*GRID + b.x] = b; }

function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
window.addEventListener('resize', resize);
resize();

window.addEventListener('keydown', e => { keys[e.key.toLowerCase()]=true;
  if(e.key.startsWith('Arrow')) e.preventDefault();
  if(e.key==='e' || e.key==='E'){ enterBtn.click(); }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()]=false; });

const joy = document.getElementById('joy');
const knob = joy.querySelector('.knob');
let joyActive=false, joyDX=0, joyDY=0;
joy.addEventListener('touchstart', e=>{e.preventDefault();joyActive=true;});
joy.addEventListener('touchmove', e=>{
  e.preventDefault();
  const r=joy.getBoundingClientRect();
  let dx=e.touches[0].clientX-(r.left+r.width/2), dy=e.touches[0].clientY-(r.top+r.height/2);
  const m=Math.hypot(dx,dy), max=36;
  if(m>max){dx=dx/m*max;dy=dy/m*max;}
  knob.style.left=(36+dx)+'px'; knob.style.top=(36+dy)+'px';
  joyDX=dx/max; joyDY=dy/max;
});
joy.addEventListener('touchend', e=>{joyActive=false;joyDX=0;joyDY=0;knob.style.left='36px';knob.style.top='36px';});

function blocked(x, y){
  const ix=Math.round(x), iy=Math.round(y);
  if(ix<0||ix>=GRID||iy<0||iy>=GRID) return true;
  return blockSet.has(iy*GRID+ix);
}
function nearEnterable(){
  const ix=Math.round(px), iy=Math.round(py);
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    const k=(iy+dy)*GRID+(ix+dx);
    if(enterMap[k]) return enterMap[k];
  }
  return null;
}
enterBtn.addEventListener('click', ()=>{
  if(inside){ inside=null; } else {
    const b=nearEnterable(); if(b){ inside={b}; px=b.x; py=b.y; }
  }
});

function draw(){
  if(inside){
    ctx.fillStyle='#2a2a2a'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#c8b98a'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='#7a5f3c'; ctx.lineWidth=3;
    const cols=3,rows=2,cw=canvas.width/cols,ch=canvas.height/rows;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      ctx.strokeRect(c*cw,r*ch,cw,ch);
      ctx.fillStyle='#7a5f3c'; ctx.font='18px sans-serif';
      ctx.fillText((c===0?'入口':'部屋')+(r*cols+c),c*cw+12,r*ch+28);
    }
    ctx.fillStyle='#fff'; ctx.font='18px sans-serif';
    ctx.fillText('【'+(inside.b.type)+'】内部',16,30);
    const spx=canvas.width/2,spy=canvas.height/2;
    ctx.fillStyle='#ffcc00'; ctx.beginPath(); ctx.arc(spx,spy,10,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#7a5a00'; ctx.lineWidth=2.5; ctx.stroke();
    enterBtn.style.display='block'; enterBtn.textContent='出る';
  } else {
    ctx.fillStyle='#2a2a2a'; ctx.fillRect(0,0,canvas.width,canvas.height);
    const scale=Math.min(canvas.width/(GRID*22), canvas.height/(GRID*22));
    const ox=(canvas.width-GRID*22*scale)/2, oy=(canvas.height-GRID*22*scale)/2;
    ctx.drawImage(bg, ox, oy, GRID*22*scale, GRID*22*scale);
    const spx=ox+px*22*scale, spy=oy+py*22*scale;
    ctx.fillStyle='#ffcc00'; ctx.beginPath(); ctx.arc(spx,spy,Math.max(7,22*scale*0.45),0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#7a5a00'; ctx.lineWidth=2.5; ctx.stroke();
    const nb=nearEnterable();
    enterBtn.style.display=nb?'block':'none'; enterBtn.textContent='入る';
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,0.05); last=now;
  let mx=0,my=0;
  if(keys['arrowleft']||keys['a'])mx-=1;
  if(keys['arrowright']||keys['d'])mx+=1;
  if(keys['arrowup']||keys['w'])my-=1;
  if(keys['arrowdown']||keys['s'])my+=1;
  if(joyActive){mx+=joyDX;my+=joyDY;}
  if(mx||my){
    const m=Math.hypot(mx,my); mx/=m; my/=m;
    const speed=6; const nx=px+mx*speed*dt, ny=py+my*speed*dt;
    if(!inside){
      if(!blocked(nx,py))px=nx;
      if(!blocked(px,ny))py=ny;
    }
    if(Math.abs(mx)>Math.abs(my))dir=mx>0?'right':'left'; else dir=my>0?'down':'up';
  }
  draw(); requestAnimationFrame(loop);
}
</script>
</body>
</html>
